{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>{% block title %}OSINT-Sentry{% endblock %}</title>
<meta name="description" content="{% block description %}A self-hosted OSINT analysis platform that records what it cannot establish instead of guessing.{% endblock %}">
<link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">
<style>
  /* One stylesheet, inline, because this is two static pages and a build
     step for them would be more moving parts than the pages are worth. */
  :root {
    --bg: #07070a;
    --panel: #0d0d12;
    --yellow: #fcee0a;
    --cyan: #00f0ff;
    --text: #e6e6ec;
    --dim: #8a8a9a;
    --border: rgba(255, 255, 255, 0.10);
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 20px; }

  header {
    border-bottom: 1px solid var(--border);
    padding: 18px 0;
  }
  header .wrap { display: flex; align-items: center; gap: 12px; }
  header img { width: 26px; height: 26px; }
  header .name {
    font-family: var(--mono);
    font-weight: 700;
    letter-spacing: 0.08em;
    font-size: 15px;
  }
  header .name span { color: var(--yellow); }
  header nav { margin-left: auto; display: flex; gap: 20px; }
  header nav a {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--dim);
    text-decoration: none;
  }
  header nav a:hover, header nav a:focus-visible { color: var(--yellow); }

  main { padding: 56px 0 72px; }
  h1 {
    font-family: var(--mono);
    font-size: clamp(26px, 4.4vw, 38px);
    line-height: 1.25;
    margin: 0 0 18px;
    letter-spacing: -0.01em;
  }
  h2 {
    font-family: var(--mono);
    font-size: 19px;
    margin: 48px 0 14px;
    color: var(--yellow);
    letter-spacing: 0.02em;
  }
  h3 {
    font-family: var(--mono);
    font-size: 15px;
    margin: 26px 0 6px;
    color: var(--cyan);
  }
  p { margin: 0 0 16px; }
  .lede { font-size: 18px; color: #c9c9d4; }
  a { color: var(--yellow); }
  code {
    font-family: var(--mono);
    font-size: 0.88em;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 1px 5px;
  }
  ul { padding-left: 20px; margin: 0 0 16px; }
  li { margin-bottom: 7px; }

  .rule {
    border-left: 3px solid var(--yellow);
    background: var(--panel);
    padding: 16px 20px;
    margin: 28px 0;
    font-family: var(--mono);
  }
  .rule b { color: var(--yellow); }

  .modules { display: grid; gap: 14px; margin: 20px 0; }
  @media (min-width: 680px) { .modules { grid-template-columns: 1fr 1fr; } }
  .module {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 16px 18px;
  }
  .module h3 { margin-top: 0; }
  .module p { margin: 0; font-size: 15px; color: #c2c2cd; }

  .facts { display: grid; gap: 14px; margin: 20px 0; }
  @media (min-width: 560px) { .facts { grid-template-columns: repeat(3, 1fr); } }
  .fact {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 14px 16px;
  }
  .fact b {
    display: block;
    font-family: var(--mono);
    font-size: 26px;
    color: var(--yellow);
    line-height: 1.2;
  }
  .fact span { font-size: 13px; color: var(--dim); }

  table { border-collapse: collapse; width: 100%; margin: 16px 0; font-size: 15px; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-family: var(--mono); font-size: 13px; color: var(--dim); font-weight: 600; }

  .cta { display: flex; flex-wrap: wrap; gap: 12px; margin: 28px 0 0; }
  .btn {
    font-family: var(--mono);
    font-size: 14px;
    text-decoration: none;
    padding: 10px 18px;
    border: 1px solid var(--yellow);
    color: var(--yellow);
    transition: background 0.15s, color 0.15s;
  }
  .btn:hover, .btn:focus-visible { background: var(--yellow); color: #07070a; }
  .btn.secondary { border-color: var(--border); color: var(--text); }
  .btn.secondary:hover, .btn.secondary:focus-visible { border-color: var(--text); background: transparent; color: var(--text); }

  footer {
    border-top: 1px solid var(--border);
    padding: 24px 0 40px;
    font-size: 13px;
    color: var(--dim);
    font-family: var(--mono);
  }
  footer a { color: var(--dim); }
  footer .wrap { display: flex; flex-wrap: wrap; gap: 8px 20px; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <img src="{% static 'favicon.svg' %}" alt="">
    <span class="name">OSINT<span>-</span>SENTRY</span>
    <nav>
      <a href="/">Overview</a>
      <a href="/privacy/">Privacy</a>
      <a href="https://github.com/Rethishkanth/OSINT-Sentry">Source</a>
    </nav>
  </div>
</header>

<main><div class="wrap">{% block content %}{% endblock %}</div></main>

<footer>
  <div class="wrap">
    <span>OSINT-Sentry</span>
    <a href="/privacy/">Privacy policy</a>
    <a href="https://github.com/Rethishkanth/OSINT-Sentry">Source code</a>
    <span>Self-hosted. No analytics on this page.</span>
  </div>
</footer>
</body>
</html>
